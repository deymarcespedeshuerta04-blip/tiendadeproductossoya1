<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="120" r="95" fill="#bbf7d0" opacity="0.45"/>
  <circle cx="760" cy="480" r="120" fill="#86efac" opacity="0.35"/>
  <circle cx="450" cy="300" r="190" fill="#ffffff" opacity="0.55"/>

  <!-- Left: Leche de Soya Tradicional (1L) -->
  <g transform="translate(85, 115)">
    <rect x="38" y="10" width="74" height="32" rx="8" fill="#15803d"/>
    <rect x="22" y="42" width="106" height="278" rx="18" fill="url(#bottleGrad)" stroke="#14532d" stroke-width="4"/>
    <rect x="34" y="105" width="82" height="135" rx="10" fill="#16a34a"/>
    <text x="75" y="145" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">RAIZ</text>
    <text x="75" y="172" font-family="Arial, sans-serif" font-size="13" fill="#dcfce7" text-anchor="middle">LECHE DE SOYA</text>
    <text x="75" y="198" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">Bs 10.00 • 1L</text>
    <text x="75" y="222" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">0% Lactosa • 9g Prot.</text>
  </g>

  <!-- Center: Hamburguesa & Tofu Artesanal -->
  <g transform="translate(320, 100)">
    <!-- Burger -->
    <ellipse cx="130" cy="95" rx="95" ry="34" fill="#d97706" stroke="#92400e" stroke-width="3"/>
    <circle cx="100" cy="88" r="3" fill="#fef3c7"/><circle cx="130" cy="82" r="3" fill="#fef3c7"/><circle cx="160" cy="90" r="3" fill="#fef3c7"/>
    <rect x="38" y="124" width="184" height="14" rx="7" fill="#16a34a"/>
    <rect x="44" y="138" width="172" height="26" rx="10" fill="#78350f"/>
    <ellipse cx="130" cy="176" rx="95" ry="26" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
    <text x="130" y="232" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Hamburguesa Soya • Bs 22.00</text>

    <!-- Tofu block -->
    <rect x="55" y="255" width="150" height="95" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="3"/>
    <line x1="55" y1="288" x2="205" y2="288" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="130" y1="255" x2="130" y2="350" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="130" y="376" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Tofu Artesanal 400g • Bs 18.00</text>
  </g>

  <!-- Right: Soya Tostada & Galletas -->
  <g transform="translate(610, 125)">
    <!-- Bowl of roasted soy -->
    <path d="M 20 120 Q 105 210 190 120 Z" fill="#15803d" stroke="#14532d" stroke-width="3"/>
    <ellipse cx="105" cy="120" rx="85" ry="22" fill="#b45309"/>
    <circle cx="75" cy="118" r="9" fill="#d97706"/><circle cx="105" cy="113" r="10" fill="#f59e0b"/><circle cx="135" cy="119" r="9" fill="#d97706"/>
    <circle cx="90" cy="125" r="8" fill="#92400e"/><circle cx="120" cy="124" r="8" fill="#b45309"/>
    <text x="105" y="218" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Soya Tostada 250g • Bs 12.00</text>

    <!-- Cookies -->
    <circle cx="72" cy="285" r="34" fill="#d97706" stroke="#78350f" stroke-width="3"/>
    <circle cx="62" cy="275" r="4" fill="#451a03"/><circle cx="82" cy="282" r="4" fill="#451a03"/><circle cx="70" cy="296" r="4" fill="#451a03"/>
    <circle cx="138" cy="285" r="34" fill="#eab308" stroke="#78350f" stroke-width="3"/>
    <circle cx="128" cy="278" r="4" fill="#451a03"/><circle cx="148" cy="288" r="4" fill="#451a03"/><circle cx="136" cy="298" r="4" fill="#451a03"/>
    <text x="105" y="345" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Galletas de Soya • Bs 14.00</text>
  </g>

  <!-- Footer ribbon on collage -->
  <rect x="70" y="518" width="760" height="48" rx="24" fill="#14532d"/>
  <text x="450" y="548" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">RAIZ NUTRICIÓN VEGETAL • 15 PIEZAS DE IMAGEN DE PRODUCTOS</text>
</svg>